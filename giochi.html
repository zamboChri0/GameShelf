<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GameShelf: la mia libreria di videogiochi, backlog e platini.">
  <title>GameShelf — Giochi</title>
  <link rel="icon" type="image/png" href="./favicon.png?v=1">
  <link rel="stylesheet" href="css/style.css?v=21">


</head>

<body>
  <header>
    <div class="contenitore barra-sito">
      <a class="logo logo-link" href="index.html">
        Game<span>Shelf</span>
      </a>

      <nav class="navigazione-sito" aria-label="Navigazione principale">
        <a href="index.html">Home</a>
        <a href="giochi.html" aria-current="page">Giochi</a>
        <a href="libreria.html">Libreria</a>
        <a href="platini.html">Platini</a>
        <a href="wishlist.html">Wishlist</a>
      </nav>
    </div>
  </header>

  <main class="contenitore">

    <section class="ricerca-giochi" aria-labelledby="titolo-ricerca">
      <h1 id="titolo-ricerca">Esplora i giochi</h1>

      <p>
        Trova un titolo e scopri immagini, piattaforme e generi.
      </p>

      <form id="form-ricerca" class="barra-ricerca">
        <label for="nome-gioco">Nome del gioco</label>

        <div class="campi-ricerca">
          <input type="search" id="nome-gioco" name="search" placeholder="Ad esempio: Elden Ring" minlength="2"
            maxlength="100" required>

          <button type="submit" id="pulsante-ricerca">
            Cerca
          </button>
        </div>
      </form>

      <p id="messaggio-ricerca" role="status"></p>

      <div id="risultati-ricerca" class="griglia"></div>

      <p class="crediti">
        Dati e immagini forniti da
        <a href="https://rawg.io/" target="_blank" rel="noopener noreferrer">
          RAWG
        </a>.
      </p>
    </section>

  </main>

  <footer>
    GameShelf · Il mio diario videoludico
    <p class="crediti-icone">
      <a href="https://www.flaticon.com/free-icons/games" title="games icons">
        Games icons created by Magnific - Flaticon
      </a>
    </p>

  </footer>

  <script src="js/api.js?v=1"></script>
  <script src="js/ricerca.js?v=14"></script>




</body>

</html>

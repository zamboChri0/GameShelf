<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GameShelf: la mia libreria di videogiochi, backlog e platini.">
  <title>GameShelf — Libreria</title>
  <link rel="icon" type="image/png" href="./favicon.png?v=1">
  <link rel="stylesheet" href="css/style.css?v=20">


</head>

<body>
  <header>
    <div class="contenitore barra-sito">
      <a class="logo logo-link" href="index.html">
        Game<span>Shelf</span>
      </a>

      <nav class="navigazione-sito" aria-label="Navigazione principale">
        <a href="index.html">Home</a>
        <a href="giochi.html">Giochi</a>
        <a href="libreria.html" aria-current="page">Libreria</a>
        <a href="platini.html">Platini</a>
      </nav>
    </div>
  </header>

  <main class="contenitore">
    <section class="libreria" aria-labelledby="titolo-libreria">
      <h1 id="titolo-libreria">La mia libreria</h1>

      <p id="messaggio-libreria" role="status"></p>

      <div class="strumenti-backup">
        <button type="button" id="esporta-backup">
          Esporta backup
        </button>

        <button type="button" id="importa-backup">
          Importa backup
        </button>

        <input type="file" id="file-backup" accept=".json,application/json" hidden>
      </div>

      <p id="messaggio-backup" role="status"></p>

      <div class="filtri-libreria">
        <label class="ricerca-libreria">
          Cerca nella tua libreria
          <input type="search" id="ricerca-libreria" placeholder="Scrivi il titolo di un gioco...">
        </label>

        <div class="riga-filtri">
          <label>
            Stato
            <select id="filtro-stato">
              <option value="">Tutti gli stati</option>
              <option value="Da iniziare">Da iniziare</option>
              <option value="In corso">In corso</option>
              <option value="In pausa">In pausa</option>
              <option value="Finito">Finito</option>
              <option value="Abbandonato">Abbandonato</option>
            </select>

          </label>

          <label>
            Piattaforma
            <select id="filtro-piattaforma">
              <option value="">Tutte le piattaforme</option>
            </select>
          </label>

          <label>
            Ordina per
            <select id="ordine-libreria">
              <option value="recenti">Ultimi aggiunti</option>
              <option value="titolo">Titolo A–Z</option>
            </select>
          </label>
        </div>

        <div class="azioni-filtri">
          <label class="filtro-platino">
            <input type="checkbox" id="filtro-platino">
            Solo platinati
          </label>
          <label class="filtro-preferiti">
            <input type="checkbox" id="filtro-preferiti">
            Solo preferiti
          </label>


          <button type="button" id="azzera-filtri">
            Azzera filtri
          </button>
        </div>
      </div>

      <div id="lista-libreria" class="griglia"></div>
    </section>


  </main>

  <footer>
    GameShelf · Il mio diario videoludico
    <p class="crediti-icone">
      <a href="https://www.flaticon.com/free-icons/games" title="games icons">
        Games icons created by Magnific - Flaticon
      </a>
    </p>

  </footer>

  <script src="js/storage.js?v=11"></script>
  <script src="js/libreria.js?v=12"></script>
  <script src="js/backup.js?v=11"></script>




</body>

</html>
